<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium GST Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.92);
      --panel-soft: rgba(30, 41, 59, 0.75);
      --card: #1e293b;
      --card-2: #0b1120;
      --line: rgba(148, 163, 184, 0.22);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #f59e0b;
      --danger: #fb7185;
      --shadow: 0 18px 35px rgba(2, 6, 23, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 28%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      font-family: Arial, sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 32px 18px;
    }

    .app {
      width: min(1200px, 100%);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
    }

    .card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.8));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    h1, h2 {
      margin: 0 0 18px;
      font-size: clamp(1.2rem, 1.7vw, 1.55rem);
      letter-spacing: 0.02em;
    }

    .mini-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input, select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
    }

    .display {
      width: 100%;
      min-height: 70px;
      text-align: right;
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      padding: 14px 16px;
      background: rgba(2, 6, 23, 0.85);
      border-radius: 14px;
      border: 1px solid var(--line);
      color: #f8fafc;
      margin-bottom: 14px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
      color: #fff;
      background: rgba(148, 163, 184, 0.14);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .char {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
    }

    .operator {
      background: rgba(245, 158, 11, 0.2);
      color: #f8d98e;
    }

    .clear {
      background: rgba(251, 113, 133, 0.18);
      color: #fca5b0;
    }

    .equal {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      grid-column: span 2;
    }

    .gst-amount-box {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .gst-amount-box button {
      background: rgba(56, 189, 248, 0.1);
      color: #bfe9ff;
    }

    .gst-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .action-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      padding: 14px 10px;
    }

    .mode-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 12px 0 16px;
      color: var(--muted);
    }

    .mode-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .mode-row input {
      width: auto;
      margin: 0;
      accent-color: var(--accent);
    }

    .result-box {
      margin-top: 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      line-height: 1.7;
      color: var(--text);
      min-height: 120px;
    }

    .result-box strong {
      color: #f8fafc;
    }

    .hsn-note {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0 0 12px;
    }

    .hsn-table-wrap {
      margin-top: 12px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(15, 23, 42, 0.7);
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 0.94rem;
    }

    th {
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.8);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    td strong {
      color: #f8fafc;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.24);
      color: #bae6fd;
      font-size: 0.8rem;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      .card { padding: 16px; }
      .gst-amount-box { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .btn-grid { gap: 8px; }
      button { padding: 14px 6px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="basic-calculator-title">
      <h1 id="basic-calculator-title">Basic Calculator</h1>
      <input id="display" class="display" type="text" readonly aria-label="Calculator display" />

      <div class="btn-grid">
        <button class="clear" onclick="clearBasic()">C</button>
        <button class="operator" onclick="appendBasic('/')">÷</button>
        <button class="operator" onclick="appendBasic('*')">×</button>
        <button class="operator" onclick="appendBasic('-')">−</button>

        <button class="char" onclick="appendBasic('7')">7</button>
        <button class="char" onclick="appendBasic('8')">8</button>
        <button class="char" onclick="appendBasic('9')">9</button>
        <button class="operator" onclick="appendBasic('+')">+</button>

        <button class="char" onclick="appendBasic('4')">4</button>
        <button class="char" onclick="appendBasic('5')">5</button>
        <button class="char" onclick="appendBasic('6')">6</button>
        <button class="operator" onclick="appendBasic('%')">%</button>

        <button class="char" onclick="appendBasic('1')">1</button>
        <button class="char" onclick="appendBasic('2')">2</button>
        <button class="char" onclick="appendBasic('3')">3</button>
        <button class="char" onclick="deleteBasic()">⌫</button>

        <button class="char" style="grid-column: span 2;" onclick="appendBasic('0')">0</button>
        <button class="char" onclick="appendBasic('.')">.</button>
        <button class="equal" onclick="calculateBasic()">=</button>
      </div>
    </section>

    <section class="card" aria-labelledby="gst-title">
      <h2 id="gst-title">GST Calculator</h2>

      <label class="mini-label" for="amount">Amount</label>
      <input id="amount" type="text" inputmode="decimal" placeholder="Enter amount" />

      <label class="mini-label" for="rate">GST Slab</label>
      <select id="rate">
        <option value="0">0%</option>
        <option value="0.25">0.25%</option>
        <option value="3">3%</option>
        <option value="5">5%</option>
        <option value="18" selected>18%</option>
        <option value="40">40%</option>
      </select>

      <div class="mode-row" role="group" aria-label="Transaction type">
        <label><input type="radio" name="supply" value="intra" checked /> Intra-state</label>
        <label><input type="radio" name="supply" value="inter" /> Inter-state</label>
      </div>

      <div class="badge-row">
        <span class="badge">CGST</span>
        <span class="badge">SGST</span>
        <span class="badge">IGST</span>
      </div>

      <div class="gst-amount-box" aria-label="Amount keypad">
        <button onclick="appendGSTAmount('7')">7</button>
        <button onclick="appendGSTAmount('8')">8</button>
        <button onclick="appendGSTAmount('9')">9</button>
        <button onclick="appendGSTAmount('4')">4</button>
        <button onclick="appendGSTAmount('5')">5</button>
        <button onclick="appendGSTAmount('6')">6</button>
        <button onclick="appendGSTAmount('1')">1</button>
        <button onclick="appendGSTAmount('2')">2</button>
        <button onclick="appendGSTAmount('3')">3</button>
        <button onclick="appendGSTAmount('.')">.</button>
        <button onclick="appendGSTAmount('0')">0</button>
        <button class="clear" onclick="clearGSTAmount()">C</button>
      </div>

      <div class="gst-actions">
        <button class="action-btn" onclick="calculateGST('add')">Add GST</button>
        <button class="action-btn" onclick="calculateGST('remove')">Remove GST</button>
      </div>

      <div id="gstResult" class="result-box" aria-live="polite">
        Enter an amount, pick a slab, and calculate GST.
      </div>
    </section>

    <section class="card" aria-labelledby="hsn-title">
      <h2 id="hsn-title">HSN Finder</h2>
      <p class="hsn-note">
        Search the sample catalog by product name or HSN code to quickly narrow down likely classification.
      </p>

      <label class="mini-label" for="hsnSearch">Search Product / HSN</label>
      <input id="hsnSearch" type="search" placeholder="e.g. rice, 1006, milk" autocomplete="off" />

      <div id="hsnResults" class="result-box" aria-live="polite">
        Start typing to search the sample HSN catalog.
      </div>
    </section>
  </main>

  <script>
    const basicDisplay = document.getElementById('display');
    const amountInput = document.getElementById('amount');

    function appendBasic(value) {
      if (basicDisplay.value === 'Error') basicDisplay.value = '';
      basicDisplay.value += value;
    }

    function clearBasic() {
      basicDisplay.value = '';
    }

    function deleteBasic() {
      basicDisplay.value = basicDisplay.value.slice(0, -1);
    }

    function calculateBasic() {
      const expression = basicDisplay.value;
      if (!expression || !/^[0-9+\-*/%.() ]+$/.test(expression)) {
        basicDisplay.value = 'Error';
        return;
      }

      try {
        const result = Function('"use strict"; return (' + expression + ')')();
        basicDisplay.value = Number.isFinite(result) ? String(result) : 'Error';
      } catch {
        basicDisplay.value = 'Error';
      }
    }

    function appendGSTAmount(value) {
      const current = amountInput.value;
      if (value === '.' && current.includes('.')) return;
      amountInput.value = current + value;
    }

    function clearGSTAmount() {
      amountInput.value = '';
    }

    function formatRupees(value) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value);
    }

    function calculateGST(action) {
      const amount = Number(amountInput.value);
      const rate = Number(document.getElementById('rate').value);
      const supply = document.querySelector('input[name="supply"]:checked').value;
      const resultBox = document.getElementById('gstResult');

      if (amountInput.value.trim() === '' || !Number.isFinite(amount) || amount < 0) {
        resultBox.textContent = 'Please enter a valid, non-negative amount.';
        return;
      }

      let taxableAmount, gstAmount, totalAmount;

      if (action === 'add') {
        taxableAmount = amount;
        gstAmount = taxableAmount * rate / 100;
        totalAmount = taxableAmount + gstAmount;
      } else {
        totalAmount = amount;
        taxableAmount = totalAmount / (1 + rate / 100);
        gstAmount = totalAmount - taxableAmount;
      }

      const cgst = supply === 'intra' ? gstAmount / 2 : 0;
      const sgst = supply === 'intra' ? gstAmount / 2 : 0;
      const igst = supply === 'inter' ? gstAmount : 0;
      const halfRate = rate / 2;

      resultBox.innerHTML = `
        <div><strong>Taxable Amount:</strong> ${formatRupees(taxableAmount)}</div>
        <div><strong>CGST (${supply === 'intra' ? halfRate : 0}%):</strong> ${formatRupees(cgst)}</div>
        <div><strong>SGST/UTGST (${supply === 'intra' ? halfRate : 0}%):</strong> ${formatRupees(sgst)}</div>
        <div><strong>IGST (${supply === 'inter' ? rate : 0}%):</strong> ${formatRupees(igst)}</div>
        <div><strong>Total GST:</strong> ${formatRupees(gstAmount)}</div>
        <div><strong>${action === 'add' ? 'Total including GST' : 'Original amount including GST'}:</strong> ${formatRupees(totalAmount)}</div>
      `;
    }

    const hsnCatalog = [
      { code: '1001', description: 'Wheat and meslin', rate: '0%' },
      { code: '1006', description: 'Rice', rate: '5%' },
      { code: '0401', description: 'Milk and cream, not concentrated', rate: '5%' },
      { code: '4901', description: 'Books and printed material', rate: '0%' },
      { code: '6109', description: 'T-shirts and garments', rate: '5% / 12% / 18%' },
      { code: '6403', description: 'Footwear', rate: '5% / 18%' },
      { code: '8471', description: 'Computers and data-processing units', rate: '18%' },
      { code: '8517', description: 'Telephone sets and communication equipment', rate: '18%' },
      { code: '2106', description: 'Food preparations', rate: '5% / 18%' },
      { code: '2202', description: 'Water, including mineral water', rate: '18%' },
      { code: '3004', description: 'Medicines for human use', rate: '12% / 18%' },
      { code: '8703', description: 'Motor cars', rate: '18%' },
      { code: '2203', description: 'Beer and other fermented drinks', rate: '18%' },
      { code: '2402', description: 'Cigarettes and tobacco products', rate: '28% / 40%+' }
    ];

    const hsnSearch = document.getElementById('hsnSearch');
    const hsnResults = document.getElementById('hsnResults');

    hsnSearch.addEventListener('input', () => {
      const query = hsnSearch.value.trim().toLowerCase();
      if (!query) {
        hsnResults.innerHTML = 'Start typing to search the sample HSN catalog.';
        return;
      }

      const matches = hsnCatalog.filter(item =>
        item.code.toLowerCase().includes(query) || item.description.toLowerCase().includes(query)
      );

      if (!matches.length) {
        hsnResults.innerHTML = '<div class="hsn-note">No sample match found. Try a broader keyword or confirm with official tariff data.</div>';
        return;
      }

      const rows = matches.map(item => `
        <tr>
          <td><strong>${item.code}</strong></td>
          <td>${item.description}</td>
          <td>${item.rate}</td>
        </tr>
      `).join('');

      hsnResults.innerHTML = `
        <div class="hsn-table-wrap">
          <table>
            <thead>
              <tr>
                <th>HSN</th>
                <th>Description</th>
                <th>Sample GST</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <p class="hsn-note" style="margin-top:12px;">This is a sample lookup only. Always verify classification and GST rate using the latest official HSN/SAC guidance.</p>
      `;
    });
  </script>
</body>
</html>
